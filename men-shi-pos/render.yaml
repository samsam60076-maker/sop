services:
  - type: web
    name: men-shi-pos
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DEPLOY_MARK
        value: "2026-10-10-refund-form-compact"
